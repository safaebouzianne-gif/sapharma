<div class="login-container">
  <div class="login-split">

    <!-- Left Decoration Side -->
    <div class="login-banner">
      <div class="banner-content">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M20 0C8.954 0 0 8.954 0 20C0 31.046 8.954 40 20 40C31.046 40 40 31.046 40 20C40 8.954 31.046 0 20 0ZM20 36C11.163 36 4 28.837 4 20C4 11.163 11.163 4 20 4C28.837 4 36 11.163 36 20C36 28.837 28.837 36 20 36Z"
              fill="white" opacity="0.3" />
            <path d="M28 14H18C15.791 14 14 15.791 14 18V28H18V18H28V14Z" fill="white" />
            <path d="M22 22H12V26H22C24.209 26 26 24.209 26 22V12H22V22Z" fill="white" />
          </svg>
          <h2>SaPharma</h2>
        </div>

        <div class="welcome-text">
          <h1>Bienvenue !</h1>
          <p>Connectez-vous pour accéder au tableau de bord de gestion de la parapharmacie.</p>
        </div>
      </div>
      <!-- Decorative circles / waves -->
      <div class="decor-circle circle-1"></div>
      <div class="decor-circle circle-2"></div>
    </div>

    <!-- Right Login Form Side -->
    <div class="login-form-wrapper">
      <div class="login-box card">
        <h3>Connexion</h3>
        <p class="subtitle">Entrez vos identifiants pour continuer</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" formControlName="username" class="form-control hover-glow"
              placeholder="Ex: admin" [ngClass]="{ 'is-invalid': f['username'].touched && f['username'].errors }" />
            <div *ngIf="f['username'].touched && f['username'].errors" class="error-text">
              Nom d'utilisateur requis.
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" formControlName="password" class="form-control hover-glow"
              placeholder="••••••••" [type]="showPassword ? 'text' : 'password'"
              [ngClass]="{ 'is-invalid': f['password'].touched && f['password'].errors }" />
            <span class="material-icons eye" (click)="togglePassword()">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
            <div *ngIf="f['password'].touched && f['password'].errors" class="error-text">
              Mot de passe requis.
            </div>

          </div>

          <div *ngIf="error" class="alert-error">
            {{ error }}
          </div>

          <button type="submit" [disabled]="loading" class="btn-primary login-btn">
            <span *ngIf="loading" class="spinner"></span>
            <span *ngIf="!loading">Se Connecter</span>
          </button>

        </form>
      </div>
    </div>

  </div>
</div>
